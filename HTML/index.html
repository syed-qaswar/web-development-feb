<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
    <!--Semantic Layout Structure, DIV, SPAN, CSS Display (inline, block , inline-block) -->
    
    <!-- top most section -->
    <header>
        <!-- CSS Flexbox -->
        <div class="navbar">
            <h1 class="title">MyWebsite</h1>
            <nav class="nav-menu">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </nav>
            <button type="button">Get in touch</button>
        </div>
    </header>

    <!-- the actual content -->
    <main>
        <section>
            <!-- a block level divisional container -->
            <div class="text">
                <h1 class="title">This is a <span>title</span></h1>
                <p class="para">this is some random text we are writing inside the div</p>

                <a href="" class="link1">Link 1</a>
                <a href="">Link 2</a>
            </div>
            <div class="image">
                <img src="../assets/images/car.jpg" alt="picture of a car">
            </div>
        </section>

        <section class="container">
            <div class="box">
                A box
            </div>

            <input type="text" class="text-field">
            <h1 class="title">Block elements</h1>
            <ul>
                <li>Full width</li>
                <li>New line</li>
            </ul>

            <h1>Inline elements</h1>
            <ul>
                <li>Only takes necessary width</li>
                <li>Same line</li>
            </ul>
        </section>


    </main>

    <!-- last section of our webpage -->
    <footer></footer>
</body>
</html>
